<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results/History</title>
    <meta name="description" content="A college football playoff information and history page.">
    <meta name="author" content="Michael McGehee">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/cfp.css">
    <script defer src="./scripts/cfp.js"></script>
</head>
<body>
    <header>
        <img class="header-logo" src="./images/cfp-logo.png" alt="The logo for the College Football Playoff.">
        <span id="page-title">The College Football Playoff</span>
        <nav>
            <ul id="header-nav">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./cfp.html">Systems</a></li>
                <li><a href="./results.html">Results</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="title">A History of the CFB</h1>
        <div id="results-container">
            <figure>
                <img loading="lazy" src="./images/alabama-img.webp" alt="2015 Alabama Football">
                <figcaption>Alabama has both appeared in and won the most College Football Playoff Championships, with 6 and 3 respectively.</figcaption>
            </figure>
            <div class="results-dropdown">
                <label for="year">Choose a year below to see who made the playoff.</label>
                <select name="year" id="year">
                    <option value="" disabled selected>Select a Year</option>
                </select>
                <h2 id="result-year">Choose a year above.</h2>
                <p id="team-amount"></p>
                <ul id="team-list"></ul>
                <p id="final-result"></p>
            </div>
        </div>
        
    </main>
    <footer>
        <p>&copy; | <span id="currentyear"></span> | Michael McGehee | Brazil</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
